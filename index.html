<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invito - Digital Event & Wedding Builder Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-pink-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const translations = {
            ka: {
                appTitle: "Invito Studio",
                appSubtitle: "ციფრული მისალოცებისა და ღონისძიებების პლატფორმა",
                editorTab: "მისალოცის რედაქტორი",
                seatingTab: "მაგიდების განაწილება",
                previewBtn: "ცოცხალი რეჟიმი",
                publishBtn: "საიტის გამოქვეყნება",
                copied: "ბმული კოპირებულია!",
                coupleDetails: "წყვილის მონაცემები",
                groomLabel: "სიძის სახელი",
                brideLabel: "პატარძლის სახელი",
                eventDate: "თარიღი და დრო",
                saveSettings: "ცვლილებების შენახვა"
            },
            en: {
                appTitle: "Invito Studio",
                appSubtitle: "Digital Event & Wedding Builder Platform",
                editorTab: "Invitation Editor",
                seatingTab: "Seating Planner",
                previewBtn: "Live Preview Mode",
                publishBtn: "Publish Website",
                copied: "Copied!",
                coupleDetails: "Couple Details",
                groomLabel: "Groom Name",
                brideLabel: "Bride Name",
                eventDate: "Event Date",
                saveSettings: "Save Settings"
            }
        };

        function App() {
            const [lang, setLang] = useState('ka');
            const [activeTab, setActiveTab] = useState('editor');
            const [copied, setCopied] = useState(false);
            
            const [data, setData] = useState({
                groom: "გიორგი",
                bride: "ნინო",
                date: "2026-09-25"
            });

            const t = translations[lang];

            const handleCopy = () => {
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                            <span className="text-xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                                {t.appTitle}
                            </span>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={() => setLang(lang === 'ka' ? 'en' : 'ka')}
                                className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-full font-medium transition"
                            >
                                {lang === 'ka' ? '🇺🇸 ENG' : '🇬🇪 GEO'}
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                            <h2 className="text-lg font-semibold mb-4 text-pink-400">{t.coupleDetails}</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">{t.groomLabel}</label>
                                    <input 
                                        type="text" 
                                        value={data.groom} 
                                        onChange={(e) => setData({...data, groom: e.target.value})}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">{t.brideLabel}</label>
                                    <input 
                                        type="text" 
                                        value={data.bride} 
                                        onChange={(e) => setData({...data, bride: e.target.value})}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"
                                    />
                                </div>
                            </div>

                            <div className="mt-6 p-6 bg-slate-950/50 border border-slate-800/80 rounded-xl text-center space-y-2">
                                <span className="text-xs uppercase tracking-widest text-pink-400 font-semibold">პლატფორმის პრევიუ</span>
                                <h1 className="text-3xl font-serif font-bold">{data.groom} & {data.bride}</h1>
                                <p className="text-slate-400 text-sm">გეპატიჟებით ჩვენს ქორწილში!</p>
                            </div>

                            <div className="mt-6 flex justify-end">
                                <button 
                                    onClick={handleCopy}
                                    className="px-5 py-2.5 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-pink-600/20"
                                >
                                    {copied ? t.copied : t.publishBtn}
                                </button>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
