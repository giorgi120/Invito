<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weddify Studio - Digital Event Builder Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @keyframes pulse-amber {
        0%, 100% { transform: scale(1.1); box-shadow: 0 0 12px rgba(245, 158, 11, 0.8); }
        50% { transform: scale(1.25); box-shadow: 0 0 20px rgba(245, 158, 11, 1); }
      }
      .animate-chair-selected {
        animation: pulse-amber 1.5s infinite ease-in-out;
      }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
          const [activeTab, setActiveTab] = useState('editor');

          // Event Details State
          const [eventType, setEventType] = useState("wedding");
          const [eventSubtitle, setEventSubtitle] = useState("იქორწინდებიან");
          const [coupleNames, setCoupleNames] = useState("გიორგი & მარიამი");
          const [weddingDate, setWeddingDate] = useState("2026-09-18");
          const [weddingTime, setWeddingTime] = useState("17:00");
          const [locationName, setLocationName] = useState("Garden Hall Batumi");
          const [locationAddress, setLocationAddress] = useState("ბათუმი, რუსთაველის გამზირი #24");
          const [googleMapsUrl, setGoogleMapsUrl] = useState("https://maps.google.com/?q=Garden+Hall+Batumi");

          // Styling State
          const [bgColor, setBgColor] = useState("#000053");
          const [bgPattern, setBgPattern] = useState("sparkles");

          // Audio State
          const [youtubeUrl, setYoutubeUrl] = useState("https://youtu.be/PsFLnpEfemU");
          const [isMusicPlaying, setIsMusicPlaying] = useState(false);

          // Seating Planner State
          const [tables, setTables] = useState([
            { id: 1, name: "მაგიდა 1 (ოჯახი)", shape: "round", capacity: 12, guests: ["დედა", "მამა", "ბებია", "პაპა", "დეიდა ნინო", "ბიძა დათო", "გია", "ეთერი", "სოფო", "ლევანი", "ნინო", "თაზო"] },
            { id: 2, name: "კოტე", shape: "rectangle", capacity: 8, guests: ["კოტე", "ანო"] },
            { id: 3, name: "მაგიდა #3", shape: "round", capacity: 8, guests: ["ნიკა", "სანდრო"] }
          ]);
          
          const [guestSearchName, setGuestSearchName] = useState("დეიდა ნინო");
          const [selectedChairIndex, setSelectedChairIndex] = useState(null);

          const getYouTubeAudioUrl = (url) => {
            if (!url) return "";
            let videoId = "";
            try {
              if (url.includes("youtu.be/")) {
                videoId = url.split("youtu.be/")[1].split("?")[0];
              } else if (url.includes("watch?v=")) {
                videoId = url.split("watch?v=")[1].split("&")[0];
              } else if (url.includes("embed/")) {
                videoId = url.split("embed/")[1].split("?")[0];
              }
            } catch (e) {
              console.log("Parsing error", e);
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1` : "";
          };

          const eventIcons = {
            wedding: { icon: "💍", label: "ქორწილი", defaultSubtitle: "იქორწინდებიან" },
            birthday: { icon: "🎂", label: "დაბადების დღე", defaultSubtitle: "გეპატიჟებით დაბადების დღეზე" },
            baptism: { icon: "✝️", label: "ნათლობა", defaultSubtitle: "გეპატიჟებით ნათლობაზე" },
            party: { icon: "🥳", label: "წვეულება", defaultSubtitle: "PARTY INVITATION" }
          };

          const handleEventTypeChange = (type) => {
            setEventType(type);
            setEventSubtitle(eventIcons[type].defaultSubtitle);
          };

          const findGuestTable = (gName) => {
            for (let tbl of tables) {
              if (tbl.guests && tbl.guests.includes(gName)) return tbl;
            }
            return tables[0] || { name: "მაგიდა", guests: [], capacity: 8 };
          };

          const guestTable = findGuestTable(guestSearchName);

          const getPatternStyle = () => {
            if (bgPattern === 'floral') {
              return {
                backgroundColor: bgColor,
                backgroundImage: 'radial-gradient(circle, rgba(219,39,119,0.2) 15%, transparent 15%)',
                backgroundSize: '24px 24px'
              };
            } else if (bgPattern === 'sparkles') {
              return {
                backgroundColor: bgColor,
                backgroundImage: 'radial-gradient(ellipse at center, rgba(234,179,8,0.3) 0%, transparent 70%)',
                backgroundSize: '30px 30px'
              };
            } else if (bgPattern === 'lace') {
              return {
                backgroundColor: bgColor,
                backgroundImage: 'linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%), linear-gradient(-45deg, rgba(255,255,255,0.1) 25%, transparent 25%)',
                backgroundSize: '20px 20px'
              };
            }
            return { backgroundColor: bgColor };
          };

          return (
            <div className="flex flex-col min-h-screen w-full bg-slate-950 text-white font-sans">
              {/* Top Bar */}
              <header className="flex flex-col sm:flex-row items-center justify-between p-4 bg-slate-900 border-b border-slate-800 gap-4">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-violet-600 flex items-center justify-center shadow-lg text-xl">
                    {eventIcons[eventType].icon}
                  </div>
                  <div>
                    <h1 className="font-bold text-base sm:text-lg leading-tight flex items-center gap-2">
                      Weddify Studio <span className="text-[10px] px-2 py-0.5 bg-violet-500/20 text-violet-400 rounded-full border border-violet-500/30">SAAS BUILDER</span>
                    </h1>
                    <p className="text-xs text-slate-400">ციფრული მისალოცებისა და ივენთების პლატფორმა</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <div className="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
                    <button 
                      onClick={() => setActiveTab('editor')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${activeTab === 'editor' ? 'bg-violet-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                    >
                      🛠️ ედიტორი
                    </button>
                    <button 
                      onClick={() => setActiveTab('preview')}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${activeTab === 'preview' ? 'bg-violet-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                    >
                      📱 მობილურის პრევიუ
                    </button>
                  </div>
                </div>
              </header>

              {/* Main Workspace */}
              <div className="flex flex-col lg:flex-row flex-1">
                {/* Editor Panel */}
                <div className={`w-full lg:w-1/2 p-4 sm:p-6 space-y-6 bg-slate-900/50 ${activeTab === 'preview' ? 'hidden lg:block' : 'block'}`}>
                  <h2 className="text-lg font-bold text-violet-400 border-b border-slate-800 pb-2">⚙️ აპლიკაციის კონფიგურაცია</h2>

                  {/* Event Type */}
                  <div className="space-y-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <h3 className="text-sm font-semibold text-slate-300">🎉 ღონისძიების ტიპი</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                      {Object.keys(eventIcons).map((key) => (
                        <button
                          key={key}
                          onClick={() => handleEventTypeChange(key)}
                          className={`p-2 rounded-xl border text-xs font-bold flex items-center justify-center space-x-1.5 transition ${eventType === key ? 'bg-violet-600 border-violet-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}`}
                        >
                          <span>{eventIcons[key].icon}</span>
                          <span>{eventIcons[key].label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* General Info */}
                  <div className="space-y-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <h3 className="text-sm font-semibold text-slate-300">მთავარი ინფორმაცია</h3>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">სათაურის ტექსტი</label>
                      <input 
                        type="text" 
                        value={eventSubtitle} 
                        onChange={(e) => setEventSubtitle(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500 mb-3" 
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">სახელი / წყვილის სახელი</label>
                      <input 
                        type="text" 
                        value={coupleNames} 
                        onChange={(e) => setCoupleNames(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500" 
                      />
                    </div>
                    <div className="grid grid-cols-2 gap-3 mt-3">
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">თარიღი</label>
                        <input 
                          type="date" 
                          value={weddingDate} 
                          onChange={(e) => setWeddingDate(e.target.value)}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500" 
                        />
                      </div>
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">დრო</label>
                        <input 
                          type="time" 
                          value={weddingTime} 
                          onChange={(e) => setWeddingTime(e.target.value)}
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500" 
                        />
                      </div>
                    </div>
                  </div>

                  {/* Location & Map */}
                  <div className="space-y-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <h3 className="text-sm font-semibold text-slate-300">📍 ადგილმდებარეობა & რუკა</h3>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">ადგილის სახელი</label>
                      <input 
                        type="text" 
                        value={locationName} 
                        onChange={(e) => setLocationName(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500" 
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">მისამართი</label>
                      <input 
                        type="text" 
                        value={locationAddress} 
                        onChange={(e) => setLocationAddress(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500" 
                      />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Google Maps / Waze ბმული</label>
                      <input 
                        type="text" 
                        value={googleMapsUrl} 
                        onChange={(e) => setGoogleMapsUrl(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500" 
                      />
                    </div>
                  </div>

                  {/* Background Styling */}
                  <div className="space-y-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <h3 className="text-sm font-semibold text-slate-300">🎨 ფონის გაფორმება & ფერი</h3>
                    <div className="flex items-center space-x-3">
                      <label className="text-xs text-slate-400">ფონის ფერი:</label>
                      <input 
                        type="color" 
                        value={bgColor} 
                        onChange={(e) => setBgColor(e.target.value)}
                        className="w-10 h-10 rounded-lg bg-transparent cursor-pointer border border-slate-700" 
                      />
                      <span className="text-xs font-mono text-slate-400">{bgColor}</span>
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">ფონის ორნამენტები</label>
                      <select 
                        value={bgPattern} 
                        onChange={(e) => setBgPattern(e.target.value)}
                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500"
                      >
                        <option value="sparkles">✨ ოქროსფერი ციმციმი (Gold Sparkles)</option>
                        <option value="floral">🌸 ყვავილოვანი დამასკი (Floral Damask)</option>
                        <option value="lace">🕸️ გეომეტრიული მაქმანი (Geometric Lace)</option>
                        <option value="none">ფონის გარეშე (მხოლოდ ფერი)</option>
                      </select>
                    </div>
                  </div>

                  {/* Music */}
                  <div className="space-y-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <h3 className="text-sm font-semibold text-slate-300">🎵 YouTube ფონური მუსიკა</h3>
                    <div className="space-y-3">
                      <div>
                        <label className="text-xs text-slate-400 block mb-1">YouTube სიმღერის ბმული</label>
                        <input 
                          type="text" 
                          value={youtubeUrl} 
                          onChange={(e) => setYoutubeUrl(e.target.value)}
                          placeholder="https://youtu.be/..."
                          className="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500" 
                        />
                      </div>
                      <button 
                        onClick={() => setIsMusicPlaying(!isMusicPlaying)}
                        className={`w-full py-2.5 rounded-xl text-xs font-bold transition ${isMusicPlaying ? 'bg-pink-600 text-white animate-pulse' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                      >
                        {isMusicPlaying ? '⏸ ფონური მუსიკის გამორთვა' : '▶ ფონური მუსიკის ჩართვა'}
                      </button>
                    </div>
                  </div>

                  {/* Seating Config */}
                  <div className="space-y-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <div className="flex justify-between items-center">
                      <h3 className="text-sm font-semibold text-slate-300">🪑 მაგიდებისა და სტუმრების მართვა</h3>
                      <button 
                        onClick={() => setTables([...tables, { id: Date.now(), name: `მაგიდა #${tables.length + 1}`, shape: 'round', capacity: 8, guests: ["ახალი სტუმარი"] }])}
                        className="px-2.5 py-1 bg-violet-600 hover:bg-violet-500 text-white text-xs font-medium rounded-lg transition"
                      >
                        + მაგიდის დამატება
                      </button>
                    </div>
                    <div className="space-y-4">
                      {tables.map((tbl, idx) => (
                        <div key={tbl.id} className="bg-slate-800/80 p-3.5 rounded-xl border border-slate-700 space-y-3">
                          <div className="flex justify-between items-center gap-2">
                            <input 
                              type="text" 
                              value={tbl.name}
                              onChange={(e) => {
                                const updated = [...tables];
                                updated[idx].name = e.target.value;
                                setTables(updated);
                              }}
                              className="bg-slate-700 px-2 py-1 rounded text-xs font-semibold w-full border border-slate-600"
                            />
                            <select 
                              value={tbl.shape}
                              onChange={(e) => {
                                const updated = [...tables];
                                updated[idx].shape = e.target.value;
                                setTables(updated);
                              }}
                              className="bg-slate-700 px-2 py-1 rounded text-xs border border-slate-600"
                            >
                              <option value="round">მრგვალი</option>
                              <option value="rectangle">მართკუთხედი</option>
                            </select>
                            <button 
                              onClick={() => setTables(tables.filter(t => t.id !== tbl.id))}
                              className="text-rose-400 hover:text-rose-300 text-xs px-1"
                            >
                              ✕
                            </button>
                          </div>

                          <div>
                            <label className="text-[10px] text-slate-400 block mb-1">
                              სტუმრების სახელები (გამოყავით მძიმით):
                            </label>
                            <textarea
                              rows="2"
                              value={(tbl.guests || []).join(", ")}
                              onChange={(e) => {
                                const updated = [...tables];
                                updated[idx].guests = e.target.value.split(",").map(s => s.trim()).filter(Boolean);
                                setTables(updated);
                              }}
                              className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none focus:border-violet-500"
                              placeholder="მაგ: გიორგი, ნინო, დათო"
                            />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                {/* Mobile Preview View */}
                <div className={`w-full lg:w-1/2 p-4 sm:p-6 bg-slate-950 flex items-center justify-center ${activeTab === 'editor' ? 'hidden lg:flex' : 'flex'}`}>
                  <div className="w-full max-w-[360px] h-[680px] bg-slate-900 rounded-[36px] border-4 border-slate-700 shadow-2xl flex flex-col overflow-hidden relative">
                    
                    {/* Header */}
                    <div className="bg-slate-900 px-4 py-2.5 border-b border-slate-800 flex justify-between items-center shrink-0 z-20">
                      <span className="text-xs font-bold text-pink-400 flex items-center gap-1">
                        <span>{eventIcons[eventType].icon}</span> Weddify Live
                      </span>
                      <button 
                        onClick={() => setIsMusicPlaying(!isMusicPlaying)}
                        className="px-2 py-0.5 bg-pink-500/20 text-pink-400 rounded-full text-[10px] font-bold border border-pink-500/30"
                      >
                        🎵 {isMusicPlaying ? 'ჩართულია' : 'მუსიკა'}
                      </button>
                    </div>

                    {/* Hidden YouTube Background Audio Player */}
                    {isMusicPlaying && getYouTubeAudioUrl(youtubeUrl) && (
                      <div className="hidden">
                        <iframe 
                          src={getYouTubeAudioUrl(youtubeUrl)} 
                          allow="autoplay" 
                          title="Hidden Audio"
                        ></iframe>
                      </div>
                    )}

                    {/* Preview Scroll Area */}
                    <div 
                      className="flex-1 overflow-y-auto p-4 space-y-4 relative z-10"
                      style={getPatternStyle()}
                    >
                      {/* Banner Card */}
                      <div className="text-center space-y-1 py-3 bg-white/90 backdrop-blur-md rounded-xl border border-white/50 shadow-sm">
                        <p className="text-[10px] uppercase font-bold text-pink-600">{eventSubtitle}</p>
                        <h2 className="text-xl font-serif font-extrabold text-slate-900">{coupleNames}</h2>
                        <p className="text-[11px] text-slate-600">📅 {weddingDate} • ⏰ {weddingTime}</p>
                      </div>

                      {/* Location Card */}
                      <div className="bg-white/90 backdrop-blur-md p-3 rounded-xl border border-white/50 space-y-1 text-center">
                        <p className="text-[9px] uppercase font-bold text-slate-400">ადგილმდებარეობა</p>
                        <h3 className="font-bold text-xs text-slate-800">{locationName}</h3>
                        <p className="text-[10px] text-slate-500">{locationAddress}</p>
                        <a 
                          href={googleMapsUrl} 
                          target="_blank" 
                          rel="noreferrer"
                          className="inline-block mt-1 px-3 py-1 bg-pink-600 text-white text-[10px] font-bold rounded-lg shadow hover:bg-pink-700 transition"
                        >
                          📍 რუკაზე გახსნა / ნავიგაცია
                        </a>
                      </div>

                      {/* Interactive Seating Planner Card with Visual Tooltip & Animation */}
                      <div className="bg-white/95 backdrop-blur-md p-3 rounded-xl border border-white/60 space-y-3 shadow">
                        <h3 className="text-xs font-bold text-center text-slate-800">🔍 იპოვე შენი ადგილი მაგიდასთან:</h3>
                        
                        <select 
                          value={guestSearchName}
                          onChange={(e) => {
                            setGuestSearchName(e.target.value);
                            setSelectedChairIndex(null);
                          }}
                          className="w-full bg-slate-100 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-medium text-slate-800 focus:outline-none"
                        >
                          {tables.flatMap(tbl => tbl.guests || []).map((g, i) => (
                            <option key={i} value={g}>{g}</option>
                          ))}
                        </select>

                        <div className="bg-pink-50/80 p-2.5 rounded-lg border border-pink-100 text-center space-y-2">
                          <p className="text-[11px] font-medium text-slate-600">
                            შენი მაგიდა: <span className="font-bold text-pink-600">{guestTable.name}</span>
                          </p>

                          {/* Interactive 2D Table */}
                          <div className="relative w-48 h-48 mx-auto flex items-center justify-center bg-white rounded-xl border border-pink-200 shadow-inner">
                            <div className="absolute flex flex-col items-center justify-center p-2 text-center bg-pink-100 border border-pink-300 rounded-full w-20 h-20 z-10">
                              <span className="text-[10px] font-bold text-slate-800">{guestTable.name.split(' ')[0]}</span>
                              <span className="text-[8px] text-slate-500">{(guestTable.guests || []).length}/{guestTable.capacity}</span>
                            </div>

                            {/* Chairs with Animated Selection */}
                            {Array.from({ length: guestTable.capacity }).map((_, i) => {
                              const angle = (i * 2 * Math.PI) / guestTable.capacity - Math.PI / 2;
                              const radius = 65;
                              const x = Math.cos(angle) * radius;
                              const y = Math.sin(angle) * radius;
                              const guestNameAtSeat = (guestTable.guests || [])[i];
                              const isCurrentGuestSeat = guestNameAtSeat === guestSearchName;
                              const isSelectedChair = selectedChairIndex === i + 1;

                              return (
                                <button
                                  key={i}
                                  onClick={() => setSelectedChairIndex(i + 1)}
                                  style={{ transform: `translate(${x}px, ${y}px)` }}
                                  className={`absolute w-6 h-6 rounded-full text-[9px] font-bold flex items-center justify-center shadow transition-all duration-300 z-20 ${
                                    isSelectedChair 
                                      ? 'bg-amber-400 text-slate-900 ring-4 ring-amber-300 animate-chair-selected z-30'
                                      : isCurrentGuestSeat 
                                      ? 'bg-pink-600 text-white ring-2 ring-pink-300' 
                                      : guestNameAtSeat 
                                      ? 'bg-slate-800 text-white hover:bg-slate-700' 
                                      : 'bg-slate-200 text-slate-600'
                                  }`}
                                >
                                  {i + 1}
                                </button>
                              );
                            })}
                          </div>

                          {/* Dynamic Visual Tooltip / Card for Selected Seat */}
                          {selectedChairIndex !== null && (
                            <div className="bg-slate-900 text-white p-2.5 rounded-xl text-[11px] flex items-center justify-between shadow-lg border border-slate-700 animate-fade-in mt-2">
                              <div className="flex items-center space-x-2">
                                <span className="px-2 py-0.5 bg-amber-500 text-slate-950 font-bold rounded text-[10px]">ადგილი {selectedChairIndex}</span>
                                <span className="font-semibold text-amber-200">
                                  {(guestTable.guests || [])[selectedChairIndex - 1] 
                                    ? (guestTable.guests || [])[selectedChairIndex - 1] 
                                    : 'თავისუფალია'}
                                </span>
                              </div>
                              <button 
                                onClick={() => setSelectedChairIndex(null)}
                                className="text-slate-400 hover:text-white px-1 font-bold text-xs"
                              >
                                ✕
                              </button>
                            </div>
                          )}
                        </div>
                      </div>

                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
