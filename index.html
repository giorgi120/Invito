<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invito - Digital Event & Wedding Builder Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-pink-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const translations = {
            ka: {
                appTitle: "Invito Studio",
                appSubtitle: "ციფრული მისალოცებისა და ღონისძიებების პლატფორმა",
                editorTab: "მისალოცის რედაქტორი",
                seatingTab: "მაგიდების განაწილება",
                previewBtn: "ცოცხალი რეჟიმი",
                publishBtn: "საიტის გამოქვეყნება",
                copied: "ბმული კოპირებულია!",
                coupleDetails: "წყვილის მონაცემები",
                groomLabel: "სიძის სახელი",
                brideLabel: "პატარძლის სახელი",
                eventDate: "თარიღი და დრო",
                venueLabel: "ადგილმდებარეობა",
                seatingTitle: "ინტერაქტიული მაგიდები",
                seatingSubtitle: "მართეთ მაგიდების ფორმები და სტუმრების განაწილება",
                addTable: "ახალი მაგიდის დამატება",
                saveSettings: "ცვლილებების შენახვა"
            },
            en: {
                appTitle: "Invito Studio",
                appSubtitle: "Digital Event & Wedding Builder Platform",
                editorTab: "Invitation Editor",
                seatingTab: "Seating Planner",
                previewBtn: "Live Preview Mode",
                publishBtn: "Publish Website",
                copied: "Copied!",
                coupleDetails: "Couple Details",
                groomLabel: "Groom Name",
                brideLabel: "Bride Name",
                eventDate: "Event Date",
                venueLabel: "Venue Name",
                seatingTitle: "Interactive Seating",
                seatingSubtitle: "Manage table shapes and guest capacity",
                addTable: "Add Table",
                saveSettings: "Save Settings"
            }
        };

        function App() {
            const [lang, setLang] = useState('ka');
            const [activeTab, setActiveTab] = useState('editor');
            const [copied, setCopied] = useState(false);
            
            const [data, setData] = useState({
                groom: "გიორგი",
                bride: "ნინო",
                date: "2026-09-25",
                venue: "თბილისი, ფაბრიკა"
            });

            const [tables, setTables] = useState([
                { id: 1, name: "მთავარი მაგიდა", capacity: 6 },
                { id: 2, name: "მეგობრები", capacity: 8 }
            ]);

            const t = translations[lang];

            const handleCopy = () => {
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
                        <div className="flex items-center space-x-2">
                            <span className="text-xl font-bold bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">
                                {t.appTitle}
                            </span>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={() => setActiveTab(activeTab === 'editor' ? 'seating' : 'editor')}
                                className="px-3 py-1 bg-pink-600/20 text-pink-400 border border-pink-500/30 text-xs rounded-lg font-medium transition"
                            >
                                {activeTab === 'editor' ? t.seatingTab : t.editorTab}
                            </button>
                            <button 
                                onClick={() => setLang(lang === 'ka' ? 'en' : 'ka')}
                                className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-xs rounded-full font-medium transition"
                            >
                                {lang === 'ka' ? '🇺🇸 ENG' : '🇬🇪 GEO'}
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 max-w-4xl w-full mx-auto p-4 space-y-6">
                        {activeTab === 'editor' ? (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                                <h2 className="text-lg font-semibold text-pink-400">{t.coupleDetails}</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">{t.groomLabel}</label>
                                        <input 
                                            type="text" 
                                            value={data.groom} 
                                            onChange={(e) => setData({...data, groom: e.target.value})}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">{t.brideLabel}</label>
                                        <input 
                                            type="text" 
                                            value={data.bride} 
                                            onChange={(e) => setData({...data, bride: e.target.value})}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-400 mb-1">{t.venueLabel}</label>
                                    <input 
                                        type="text" 
                                        value={data.venue} 
                                        onChange={(e) => setData({...data, venue: e.target.value})}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"
                                    />
                                </div>

                                <div className="mt-6 p-6 bg-slate-950/50 border border-slate-800/80 rounded-xl text-center space-y-2">
                                    <span className="text-xs uppercase tracking-widest text-pink-400 font-semibold">პლატფორმის პრევიუ</span>
                                    <h1 className="text-3xl font-serif font-bold">{data.groom} & {data.bride}</h1>
                                    <p className="text-slate-400 text-sm">გეპატიჟებით ჩვენს ქორწილში! • {data.venue}</p>
                                </div>

                                <div className="mt-6 flex justify-end">
                                    <button 
                                        onClick={handleCopy}
                                        className="px-5 py-2.5 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-pink-600/20"
                                    >
                                        {copied ? t.copied : t.publishBtn}
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-lg font-semibold text-pink-400">{t.seatingTitle}</h2>
                                        <p className="text-xs text-slate-400">{t.seatingSubtitle}</p>
                                    </div>
                                    <button 
                                        onClick={() => setTables([...tables, { id: tables.length + 1, name: `მაგიდა #${tables.length + 1}`, capacity: 6 }])}
                                        className="px-3 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-xs font-medium transition"
                                    >
                                        + {t.addTable}
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                                    {tables.map((table) => (
                                        <div key={table.id} className="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2">
                                            <div className="font-medium text-sm">{table.name}</div>
                                            <div className="text-xs text-slate-400">ტევადობა: {table.capacity} სტუმარი</div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
